# The site editor at /admin (Sveltia CMS), the same setup as red-thread-labs.com.
#
# While previewing (npm start): open http://localhost:8080/admin/ in Chrome or Edge,
# choose "Work with Local Repository" and pick this project's folder. Saving writes the
# files on your Mac; then commit and push as usual. The editor never runs git itself.
#
# On the live site: "Sign In Using Access Token" with a GitHub personal access token.
#
# What's editable here:
#   Pages            the words on every page (_data/pages/*.yml)
#   Lists            the gallery, music releases, fashion photos, ritual events, contact form and menu (_data/*.yml)
#   Poetry, Essays, Workshop projects   one Markdown file each
# The page designs themselves (.njk files) are edited in a text editor.
#
# Note: saving a file in the editor rewrites it, so any "# comment" lines in it are dropped.
# They're only notes; the page is unchanged. The same notes are shown as hints in the editor.


backend:
  name: github
  repo: jdcarlston/maddercraft.com
  branch: main

# Pictures added inside a poem or essay. (They also need `npm run media:upload` to reach the media bucket.)
media_folder: writing/images
public_folder: /writing/images

collections:
  # ---------- Pages: the words on each page, one file each in _data/pages/ ----------
  - name: pages
    label: Pages
    label_singular: Page
    description: "The words on each page. The layout and pictures stay as designed. Text boxes use Markdown: *italic*, **bold**, [link text](/url/)."
    files:
      - name: bio
        label: Bio
        file: _data/pages/bio.yml
        # The &names below define fields that other pages reuse with *names.
        fields:
          - &f_description { name: description, label: Search and link-preview description, widget: text, required: false }
          - &f_label { name: label, label: Small label above the title, widget: string }
          - &f_title { name: title, label: Title, widget: string }
          - &f_intro { name: intro, label: Intro, widget: text, required: false, hint: "One paragraph. Markdown works: *italic*, **bold**, [link text](/url/)." }
          - { name: photoAlt, label: Description of the portrait, widget: string }
          - { name: text, label: Text, widget: markdown }
          - &f_buttons
            name: buttons
            label: Buttons
            widget: list
            required: false
            summary: "{{fields.text}} → {{fields.href}}"
            fields:
              - { name: text, label: Button text, widget: string }
              - { name: href, label: Link, widget: string, hint: "A page like /contact/?kind=ceremony or a full address like https://..." }
              - { name: style, label: Style, widget: select, default: rose, options: [ { label: "Filled (rose)", value: rose }, { label: "Outline (gold)", value: line } ] }
      - name: ritual
        label: Ritual
        file: _data/pages/ritual.yml
        fields:
          - *f_description
          - *f_label
          - *f_title
          - &f_introLines { name: introLines, label: Intro phrases, widget: list, required: false, hint: "Each phrase stays together on one line when the text wraps. Used instead of Intro." }
          - *f_buttons
          - &f_sections
            name: sections
            label: Sections
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { name: id, label: Section address, widget: string, required: false, hint: "Lets a menu link jump here, like /ritual/#ceremonies. If the menu uses it, keep it the same." }
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: text, label: Text, widget: markdown, required: false }
              - name: list
                label: Two-column list
                widget: list
                required: false
                summary: "{{fields.name}} · {{fields.note}}"
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: note, label: Note, widget: string }
              - { name: textAfter, label: Text after the list, widget: markdown, required: false }
              - { name: ritualEvents, label: Show the ritual events list, widget: boolean, required: false, hint: "The events come from Lists → Ritual events." }
              - *f_buttons
          - { name: closingButtons, label: Buttons at the end, widget: list, required: false, fields: [ { name: text, label: Button text, widget: string }, { name: href, label: Link, widget: string }, { name: style, label: Style, widget: select, default: rose, options: [ { label: "Filled (rose)", value: rose }, { label: "Outline (gold)", value: line } ] } ] }
      - name: home
        label: Home
        file: _data/pages/home.yml
        fields:
          - { name: heroTagline, label: Tagline under the title, widget: string, hint: "The words Art, music, writing, fashion and ritual each link to their page." }
          - name: now
            label: Now in the studio (the project shown first)
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: project, label: Project, widget: relation, collection: projects, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
              - { name: text, label: Words under it, widget: text }
              - *f_buttons
          - { name: thread, label: The thread, widget: object, fields: [ { name: label, label: Label, widget: string }, { name: heading, label: Heading, widget: string }, { name: text, label: Text, widget: markdown } ] }
          - { name: art, label: Art row, widget: object, fields: [ { name: label, label: Label, widget: string }, { name: heading, label: Heading, widget: string } ] }
          - { name: music, label: Music row, widget: object, fields: [ { name: label, label: Label, widget: string } ] }
          - name: poetry
            label: Poetry
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: featuredPoem, label: Featured poem, widget: relation, collection: poetry, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
              - { name: featuredImageAlt, label: Description of the featured poem's picture, widget: string }
          - { name: work, label: Work with me band, widget: object, fields: [ { name: label, label: Label, widget: string }, { name: heading, label: Heading, widget: string }, { name: intro, label: Intro, widget: string }, { name: button, label: Button text, widget: string } ] }
          - { name: signup, label: Mailing list sign-up, widget: object, fields: [ { name: label, label: Label, widget: string }, { name: heading, label: Heading, widget: string }, { name: text, label: Text, widget: string }, { name: button, label: Button text, widget: string } ] }
          - name: ritual
            label: Ritual block
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: ledes, label: Paragraphs, widget: list, field: { name: lede, label: Paragraph, widget: text } }
              - *f_buttons
      - name: fashion
        label: Fashion
        file: _data/pages/fashion.yml
        fields:
          - *f_description
          - *f_label
          - *f_title
          - *f_intro
          - *f_buttons
          - name: styling
            label: Styling consultations
            widget: object
            fields:
              - { name: label, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: markdown }
              - *f_buttons
      - { name: engineering, label: Engineering Leadership, file: _data/pages/engineering.yml, fields: [ *f_description, *f_label, *f_title, *f_intro, *f_buttons, *f_sections ] }
      - { name: red-thread-labs, label: Red Thread Labs, file: _data/pages/red-thread-labs.yml, fields: [ *f_description, *f_label, *f_title, *f_introLines, *f_buttons, *f_sections ] }
      - { name: art, label: Art, file: _data/pages/art.yml, fields: [ *f_description, *f_label, *f_title, { name: inProgressHeading, label: Heading above the projects in progress, widget: string }, { name: inProgressIntro, label: Words under it, widget: text }, { name: creationsHeading, label: Heading above the finished pieces, widget: string } ] }
      - { name: music, label: Music, file: _data/pages/music.yml, fields: [ *f_description, *f_label, *f_buttons, { name: performanceLabel, label: Performance label, widget: string }, { name: performanceHeading, label: Performance heading, widget: string } ] }
      - { name: poetry-page, label: Poetry list, file: _data/pages/poetry.yml, fields: [ *f_description, *f_label, *f_title, { name: intro, label: Intro, widget: string, hint: "{count} becomes the number of poems." }, { name: selectedHeading, label: Heading above the selected poems, widget: string }, { name: selected, label: Selected poems (shown first), widget: relation, collection: poetry, value_field: "{{slug}}", search_fields: [title], display_fields: [title], multiple: true }, { name: archiveHeading, label: Heading above all the poems, widget: string } ] }
      - { name: essays-page, label: Essays list, file: _data/pages/essays.yml, fields: [ *f_description, *f_label, *f_title, *f_intro ] }
      - name: work-with-me
        label: Work with me
        file: _data/pages/work-with-me.yml
        fields:
          - *f_description
          - *f_label
          - *f_title
          - *f_intro
          - name: ways
            label: Ways to work together
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { name: id, label: Section address, widget: string, hint: "Lets a link jump here, like /work-with-me/#ceremony." }
              - { name: heading, label: Heading, widget: string }
              - { name: forWho, label: Who it's for, widget: string }
              - { name: text, label: Text, widget: markdown }
              - *f_buttons
          - { name: closing, label: Closing invitation, widget: object, fields: [ { name: heading, label: Heading, widget: string }, { name: text, label: Text, widget: text }, *f_buttons ] }
          - name: invite
            label: Invitation at the end of project and ritual pages
            widget: object
            fields:
              - { name: label, label: Small label, widget: string }
              - { name: heading, label: Question, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: button, label: Button text, widget: string }
              - { name: moreLink, label: Link to this page, widget: string }
      - name: contact
        label: Contact
        file: _data/pages/contact.yml
        fields:
          - *f_description
          - *f_label
          - *f_title
          - *f_intro
          - { name: kindsLabel, label: Question above the kinds of work, widget: string }
          - { name: sendButton, label: Send button, widget: string }
          - { name: thanksIntro, label: Thank-you message after sending, widget: text, hint: "A link to your calendar is added after it." }

  # ---------- Lists: the gallery, releases, photos, events, contact form and menu ----------
  - name: lists
    label: Lists
    label_singular: List
    files:
      - name: art
        label: Gallery
        file: _data/art.yml
        fields:
          - { name: intro, label: Intro (Gallery page and home page), widget: text }
          - { name: featured, label: On the home page, widget: list, hint: "File names from the pieces below, in the order to show them." }
          - name: pieces
            label: Pieces
            widget: list
            summary: "{{fields.title}} {{fields.file}}"
            hint: "Shown in this order. Pictures live in assets/img/art/."
            fields:
              - { name: file, label: File name, widget: string }
              - { name: alt, label: Description for screen readers, widget: string }
              - { name: title, label: Title, widget: string, required: false, hint: "With a title, the piece gets a caption." }
              - { name: medium, label: Medium, widget: string, required: false }
              - { name: page, label: Links to page, widget: string, required: false, hint: "Like /workshop/windward-weave/. Leave empty to open the full-size picture." }
      - name: music
        label: Music
        file: _data/music.yml
        fields:
          - { name: band, label: Band name, widget: string }
          - { name: intro, label: Intro (Music page and home page), widget: text }
          - { name: listen, label: SoundCloud link, widget: string }
          - name: releases
            label: Releases
            widget: list
            summary: "{{fields.title}} · {{fields.note}}"
            fields:
              - { name: title, label: Title, widget: string, hint: "Its menu link is the title in lowercase with hyphens, like /music/#bone-mother." }
              - { name: note, label: Note, widget: string, hint: "Like 2020 or EP · Coming soon" }
              - { name: file, label: Cover file (assets/img/music/), widget: string }
              - { name: w, label: Cover width, widget: number }
              - { name: h, label: Cover height, widget: number }
              - name: tracks
                label: Songs
                widget: list
                required: false
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: file, label: Audio file (in the media bucket), widget: string }
                  - { name: length, label: Length, widget: string, hint: "Like 3:42" }
                  - { name: preview, label: Preview clip, widget: boolean, required: false }
          - name: performances
            label: Performance photos
            widget: list
            fields:
              - { name: file, label: File name (assets/img/music/), widget: string }
              - { name: alt, label: Description for screen readers, widget: string }
      - name: modeling
        label: Fashion photos
        file: _data/modeling.yml
        fields:
          - { name: credit, label: Photographer, widget: object, fields: [ { name: name, label: Name, widget: string }, { name: url, label: Website, widget: string } ] }
          - name: photos
            label: Photos
            widget: list
            summary: "{{fields.who}} · {{fields.file}}"
            hint: "Shown in this order. Photos live in assets/img/modeling/."
            fields:
              - { name: file, label: File name, widget: string }
              - { name: alt, label: Description for screen readers, widget: string }
              - { name: who, label: Who's in it, widget: string, required: false }
      - name: ritual
        label: Ritual events & photos
        file: _data/ritual.yml
        fields:
          - name: events
            label: Events (most recent first)
            widget: list
            summary: "{{fields.name}} · {{fields.when}}"
            fields:
              - { name: name, label: Event, widget: string }
              - { name: when, label: When, widget: string }
          - name: photos
            label: Photos (home page slider)
            widget: list
            required: false
            summary: "{{fields.title}} · {{fields.file}}"
            hint: "Shown in this order, one at a time, beside Ritual & Ceremony on the home page. Photos live in assets/img/ritual/, or give a full path like /assets/img/ritual-altar.jpg."
            fields:
              - { name: file, label: File name, widget: string }
              - { name: alt, label: Description for screen readers, widget: string }
              - { name: title, label: Caption title, widget: string, required: false, hint: "Like Element 11 Sanctuary" }
              - { name: note, label: Caption note, widget: string, required: false, hint: "Like 2024" }
              - { name: w, label: Width (shape), widget: number, required: false, hint: "With Height, the photo's shape, like 4 and 5. Leave both empty for a 4:5 portrait." }
              - { name: h, label: Height (shape), widget: number, required: false }
      - name: contact
        label: Contact form
        file: _data/contact.yml
        fields:
          - { name: calendly, label: Calendar link people go to after sending, widget: string }
          - name: kinds
            label: Kinds of work
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: Short id, widget: string, hint: "Lowercase with hyphens. /contact/?kind=<id> preselects it." }
              - { name: name, label: Name, widget: string }
      - name: menu
        label: Menu
        file: _data/menu.yml
        fields:
          - name: nav
            label: Main menu
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
              - { name: match, label: Also highlight for pages under, widget: string, required: false, hint: "Like /workshop/, so project pages highlight Art in the menu." }
              - name: children
                label: Sub-menu
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Link, widget: string }
          - name: cta
            label: Button at the end of the menu
            widget: object
            required: false
            fields:
              - { name: label, label: Button text, widget: string }
              - { name: href, label: Link, widget: string }
          - name: elsewhere
            label: Footer links
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }

  # ---------- Poetry: one file per poem in poetry/ ----------
  - name: poetry
    label: Poetry
    label_singular: Poem
    description: "Each poem is shown exactly as typed: every line break is kept. Use * * * on its own line for a section break."
    folder: poetry
    extension: md
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}} · {{date | date('MMM YYYY')}}"
    sortable_fields: [title, date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: form, label: Form, widget: select, required: false, options: [song], hint: "Leave empty for a poem. Choose song for lyrics." }
      - { name: category, label: Category, widget: hidden, default: poetry }
      - { name: sorted_by, label: Sorted by, widget: hidden, default: hand }
      - { name: medium_tags, label: Tags, widget: list, required: false }
      - { name: medium_url, label: Original Medium link, widget: string, required: false }
      # A plain text box (not the formatting editor) so line breaks and spacing stay exactly as written.
      - { name: body, label: Poem, widget: text }

  # ---------- Essays: one file per essay in essays/ ----------
  - name: essays
    label: Essays
    label_singular: Essay
    folder: essays
    extension: md
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}} · {{date | date('MMM YYYY')}}"
    sortable_fields: [title, date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: category, label: Category, widget: hidden, default: prose }
      - { name: sorted_by, label: Sorted by, widget: hidden, default: hand }
      - { name: medium_tags, label: Tags, widget: list, required: false }
      - { name: medium_url, label: Original Medium link, widget: string, required: false }
      - { name: body, label: Essay, widget: markdown }

  # ---------- Workshop projects: one file per project in projects/ ----------
  - name: projects
    label: Art projects
    label_singular: Project
    description: "Pages under /workshop/, listed on the Art page under In progress. Photos go in assets/img/projects/<page address>/; type just the file name here."
    folder: projects
    extension: md
    format: frontmatter
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{order}}. {{title}} · {{status}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: order, label: Order on the Art page, widget: number, value_type: int }
      - { name: status, label: Status note, widget: string, hint: "Short note on the card, like 'Book · In progress'." }
      - { name: subtitle, label: Subtitle, widget: text }
      - { name: description, label: Search and link-preview description, widget: text }
      - { name: invite, label: 'Show the invitation at the end ("Want something like this?")', widget: boolean, default: true, required: false }
      - { name: inviteHeading, label: Its question, widget: string, required: false, hint: "Leave empty for the usual question, set in Pages → Work with me." }
      - { name: inviteKind, label: Kind of work its button picks on the contact form, widget: string, required: false, hint: "An id from Lists → Contact form, like music or art-commission." }
      - name: photos
        label: Gallery photos
        widget: list
        required: false
        fields:
          - { name: file, label: File name, widget: string }
          - { name: alt, label: Description for screen readers, widget: string }
          - { name: caption, label: Caption, widget: string, required: false }
      - name: video
        label: Video (one clip)
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: file, label: Video file (in the media bucket), widget: string }
          - { name: poster, label: Poster image, widget: string }
          - { name: caption, label: Caption, widget: string, required: false }
      - name: videos
        label: Videos (several clips; the first plays on its own)
        widget: list
        required: false
        fields:
          - { name: file, label: Video file (in the media bucket), widget: string }
          - { name: poster, label: Poster image, widget: string }
          - { name: caption, label: Caption, widget: string, required: false }
      - name: tracks
        label: Songs
        widget: list
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: file, label: Audio file (in the media bucket), widget: string }
          - { name: length, label: Length, widget: string, hint: "Like 3:42" }
          - { name: preview, label: Preview clip, widget: boolean, required: false }
      - name: request
        label: '"Request this for your event" form'
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
          - { name: options, label: Choices, widget: list }
      - name: support
        label: '"Help build or fund it" form'
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Text, widget: text }
          - { name: options, label: Choices, widget: list }
      - { name: body, label: Page text, widget: markdown }
