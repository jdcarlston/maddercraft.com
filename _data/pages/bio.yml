description: JD Carlston, the engineer and artist behind Madder Craft, Rose Madder and Roz Madder.
label: About
title: JD Carlston
intro: Engineer, artist, ritualist. The person behind Madder Craft, the music of Rose Madder and the poetry of Roz Madder.
photoAlt: JD in a black lace gown before a fountain in a red-lit courtyard at the Versace Mansion, one arm reaching out
text: |-
  I'm an engineer and an artist. I stopped treating those as two different things a long time ago. I grew up on a farm on the edge of Salt Lake City, among cows, horses, geese and more, in a family of engineers and teachers, and I have been building things ever since.

  Madder Craft is where my creations live: paintings in watercolor, oil pastel and acrylic; fiber work like the [*Windward Weave*](/workshop/windward-weave/); sculpture like the [*Venus Hum*](/workshop/venus-hum/), an interactive heart you play by jumping with your friends; music as [Rose Madder](/music/), somewhere between ecstatic black metal, noise and folk; and [poetry](/poetry/) under my pen name, Roz Madder.

  I also craft [rituals and ceremonies](/ritual/) for the turning points of a life. I have held rituals since 2012, coordinated the Sanctuary for Element 11 since 2019 and led it since 2022, and held ceremonies at Burning Man, Love Burn, Lakes of Fire, Alchemy and Babalon Rising.

  Under all of what I do is one practice: helping people, and the things we make together, become more whole. **I don't fix people.** I help them see the patterns they live inside, and practice something new.

  I've spent more than twenty years leading engineering teams; read more about my [engineering leadership](/engineering/). Through [Red Thread Labs](/red-thread-labs/) I run workshops and retreats and provide coaching for groups and individuals.
