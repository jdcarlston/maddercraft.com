  textAfter: At Stack Overflow I coordinated eight teams through a re-architecture that **launched on schedule** and **doubled deploy frequency**. At Pluralsight I led architecture for an organization of up to **500 people across 65+ teams** on three continents, through two acquisitions. At Merrick Bank I grew engineering **from 2 people to 16**, serving **4.5 million customers a month**.
- heading: Facilitation and consulting
  text: 'I bring engineers and subject-matter experts together to work through real problems: Design Storms and EventStorms, workshops at conferences in the US and Europe, and decisions about where domain boundaries belong. I offer leadership and team coaching, working sessions, offsites and workshops.'
