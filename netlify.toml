[build]
  command = "npm run build"
  publish = "_site"

# Project pages used to live under /art/. Old links still work.
# The Modeling page was renamed Fashion.
[[redirects]]
  from = "/modeling/"
  to = "/fashion/"
  status = 301

[[redirects]]
  from = "/art/windward-weave/"
  to = "/workshop/windward-weave/"
  status = 301

[[redirects]]
  from = "/art/venus-hum/"
  to = "/workshop/venus-hum/"
  status = 301

# The Workshop page was folded into Art (In progress). Project pages stay at /workshop/<name>/.
[[redirects]]
  from = "/workshop/"
  to = "/art/#in-progress"
  status = 301

# "This Is Wealth" moved from Poetry to Essays (it's a personal essay with a poem at the end).
[[redirects]]
  from = "/poetry/this-is-wealth/"
  to = "/essays/this-is-wealth/"
  status = 301

# "Jesus Christ, What a Mess!" moved from Poetry to Essays.
[[redirects]]
  from = "/poetry/jesus-christ-what-a-mess/"
  to = "/essays/jesus-christ-what-a-mess/"
  status = 301

[[redirects]]
  from = "/poetry/flavor-implosion/"
  to = "/essays/flavor-implosion/"
  status = 301

[build.environment]
  NODE_VERSION = "22"
